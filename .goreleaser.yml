project_name: threadterm

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: threadterm
    main: ./cmd/threadterm
    binary: threadterm
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/arifaqyl/threadterm/internal/cli.Version={{.Version}}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/AUTH.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
